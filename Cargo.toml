[package]
name = "albat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Albat to C++ transpiler"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dependencies]
wasm-bindgen = { version = "0.2.129", optional = true }

[features]
wasm-bindgen = ["dep:wasm-bindgen"]
